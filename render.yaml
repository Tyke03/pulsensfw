services:
  - type: web
    name: pulsensfw
    runtime: node
    buildCommand: npm run build
    startCommand: node dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: pulsensfw-data
      mountPath: /data
      sizeGB: 1
